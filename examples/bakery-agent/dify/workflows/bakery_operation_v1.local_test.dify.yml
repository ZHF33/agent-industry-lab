app:
  description: Provider-free local test workflow for validating n8n -> Dify -> response without model API keys.
  icon: "\U0001F950"
  icon_background: '#FFEAD5'
  mode: workflow
  name: Bakery AI Operations - Local Test
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.1
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: template-transform
      id: start-to-local-test
      source: start_node
      sourceHandle: source
      target: local_test_generator
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: template-transform
        targetType: end
      id: local-test-to-end
      source: local_test_generator
      sourceHandle: source
      target: end_node
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: Start
        type: start
        variables:
        - label: product_query
          max_length: 200
          options: []
          required: true
          type: text-input
          variable: product_query
        - label: campaign_goal
          max_length: 500
          options: []
          required: true
          type: paragraph
          variable: campaign_goal
        - label: product_knowledge
          max_length: 5000
          options: []
          required: false
          type: paragraph
          variable: product_knowledge
        - label: brand_context
          max_length: 2000
          options: []
          required: false
          type: paragraph
          variable: brand_context
        - label: platform_rules
          max_length: 2000
          options: []
          required: false
          type: paragraph
          variable: platform_rules
        - label: date
          max_length: 50
          options: []
          required: false
          type: text-input
          variable: date
      height: 220
      id: start_node
      position:
        x: 30
        y: 220
      positionAbsolute:
        x: 30
        y: 220
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: Local test node. Replace with LLM workflow after model provider is configured.
        selected: false
        template: |
          {
            "mode": "local_test_no_model_provider",
            "input_echo": {
              "product_query": "{{ product_query }}",
              "campaign_goal": "{{ campaign_goal }}",
              "date": "{{ date }}"
            },
            "content_plan": {
              "theme": "本地测试主题：{{ product_query }}",
              "target_customer": "面包店到店和外带用户",
              "content_angles": ["新鲜出炉", "口感展示", "人工审核后发布"],
              "xiaohongshu_brief": "围绕 {{ product_query }} 写一篇待审核笔记。",
              "douyin_brief": "围绕 {{ product_query }} 生成 30 秒以内口播脚本。",
              "visual_direction": "自然光食品摄影，突出酥脆质感。",
              "risk_notes": ["local test output; no model provider used"]
            },
            "xiaohongshu_copy": {
              "titles": ["今天想吃点酥的", "{{ product_query }}上新测试"],
              "cover_text": "今日主推",
              "body": "这是本地测试文案，用于验证 Dify 和 n8n 链路。",
              "hashtags": ["面包店", "本地测试", "待审核"],
              "cta": "到店前请以门店实际供应为准。",
              "compliance_notes": ["未自动发布"]
            },
            "douyin_script": {
              "hook": "今天这款 {{ product_query }}，先听这个酥脆声。",
              "shots": [
                {"time": "0-3s", "visual": "产品特写", "voiceover": "今日主推出炉", "onscreen_text": "今日主推"},
                {"time": "3-10s", "visual": "切面和手掰", "voiceover": "看层次和口感", "onscreen_text": "酥脆层次"}
              ],
              "cta": "内容待人工审核。",
              "compliance_notes": ["不含自动发布"]
            },
            "image_prompt": {
              "prompt_zh": "自然光食品摄影，{{ product_query }} 放在浅色烘焙纸上，突出真实质感。",
              "prompt_en": "Natural light bakery food photography, realistic texture, clean background.",
              "negative_prompt": "fake text, distorted food, plastic texture",
              "aspect_ratio": "3:4",
              "style_notes": ["realistic", "clean"],
              "safety_notes": ["no trademark", "no health claim"]
            },
            "video_prompt": {
              "video_prompt_zh": "{{ product_query }} 出炉、切面、手掰的 5 秒食品短片。",
              "video_prompt_en": "A 5-second bakery product clip showing fresh pastry texture.",
              "duration_seconds": 5,
              "camera_motion": "slow push-in",
              "keyframes": ["fresh baked product", "close-up texture"],
              "negative_prompt": "warped food, fake text",
              "async_provider_notes": ["placeholder only"]
            },
            "compliance_result": {
              "approved": false,
              "risk_level": "low",
              "issues": [],
              "required_edits": ["人工审核后再发布"],
              "safe_publish_summary": "本地测试链路通过；未调用模型 provider。"
            }
          }
        title: Local Test Content Generator
        type: template-transform
        variables:
        - value_selector:
          - start_node
          - product_query
          value_type: string
          variable: product_query
        - value_selector:
          - start_node
          - campaign_goal
          value_type: string
          variable: campaign_goal
        - value_selector:
          - start_node
          - date
          value_type: string
          variable: date
      height: 110
      id: local_test_generator
      position:
        x: 330
        y: 220
      positionAbsolute:
        x: 330
        y: 220
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - local_test_generator
          - output
          value_type: string
          variable: result
        - value_selector:
          - local_test_generator
          - output
          value_type: string
          variable: content_plan
        - value_selector:
          - local_test_generator
          - output
          value_type: string
          variable: xiaohongshu_copy
        - value_selector:
          - local_test_generator
          - output
          value_type: string
          variable: douyin_script
        - value_selector:
          - local_test_generator
          - output
          value_type: string
          variable: image_prompt
        - value_selector:
          - local_test_generator
          - output
          value_type: string
          variable: video_prompt
        - value_selector:
          - local_test_generator
          - output
          value_type: string
          variable: compliance_result
        selected: false
        title: End
        type: end
      height: 170
      id: end_node
      position:
        x: 630
        y: 220
      positionAbsolute:
        x: 630
        y: 220
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.7
